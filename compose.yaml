services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: expedicao_piraiba
      POSTGRES_USER: expedicao_piraiba
      POSTGRES_PASSWORD: expedicao_piraiba
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expedicao_piraiba"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DEBUG: "true"
      SECRET_KEY: unsafe-local-development-key
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: admin@expedicaopiraiba.com.br
      ADMIN_PASSWORD: admin-local-2026
      POSTGRES_DB: expedicao_piraiba
      POSTGRES_USER: expedicao_piraiba
      POSTGRES_PASSWORD: expedicao_piraiba
      POSTGRES_HOST: db
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  jobs:
    build: ./backend
    environment:
      DEBUG: "true"
      SECRET_KEY: unsafe-local-development-key
      POSTGRES_DB: expedicao_piraiba
      POSTGRES_USER: expedicao_piraiba
      POSTGRES_PASSWORD: expedicao_piraiba
      POSTGRES_HOST: db
    command: sh -c "while true; do python manage.py expire_holds; sleep 60; done"
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_ENABLE_DEV_TOOLS: "true"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
