services:
  gateway:
    image: ${GATEWAY_IMAGE:?}
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    env_file: ["/etc/piraiba/gateway.env"]
    command: ["python", "/opt/gateway.py"]
    ports: ["127.0.0.1:8090:8090"]
    volumes: ["/root/infra/piraiba/gateway.py:/opt/gateway.py:ro"]
    mem_limit: 128m
    cpus: 0.15
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health',timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
